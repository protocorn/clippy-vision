[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Clippy_Vision"
version = "1.2.2"

# Handle the repository's flat package layout.
[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "classifier*", "agent*"]

[tool.pytest.ini_options]
# Only tests/ is a regression suite. test_installation.py at the repo root
# is a human-run setup check. A bare `pytest` used to collect every
# test_*.py in the repo, and an unguarded `from core.storage import conn`
# bound the session to the real core/data/events.db before any isolation
# guard ran. Scoping discovery to tests/ prevents that.
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["I", "UP", "E", "F", "B"]

ignore = [
    "E501", # Line too long
    "E402", # Module level import not at top of file
    "F401", # Imported but unused
    "F541", # f-string without placeholders
    "B905", # zip() without an explicit strict parameter
    "B007", # Unused loop control variable
]
