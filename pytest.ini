[pytest]
markers =
    windows: Tests that require Windows platform or Windows-specific APIs (uiautomation, win32api)
    macos: Tests that require macOS platform or macOS-specific APIs (pyobjc, AppleScript)
    linux: Tests that require Linux platform or Linux-specific tools (xdotool, AT-SPI)
    requires_ollama: Tests that require a running Ollama server
    requires_gui: Tests that require a display server (X11, Wayland, or GUI)
    integration: Full integration tests requiring complete app setup
