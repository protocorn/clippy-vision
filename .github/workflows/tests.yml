name: Python Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  electron-mcp-paths:
    name: Electron MCP paths on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run MCP config path tests
        working-directory: electron-ui
        run: node --test electron/lib/mcp.test.js electron/lib/setup.test.js electron/lib/api-spawn.test.js

  electron-renderer-lint:
    name: Electron renderer lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Electron UI deps
        working-directory: electron-ui
        run: npm install --no-fund --no-audit

      - name: Lint renderer modules (no-undef)
        working-directory: electron-ui
        run: npm run lint:renderer

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          # Linux: pynput is excluded from requirements.txt (evdev has no cp313 wheel).
          # Install with --no-deps so the X11/python-xlib backend is used without compiling evdev.
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install --no-deps pynput
          fi
        shell: bash
      
      - name: Install Linux Xvfb test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-xserver-utils xterm
      
      - name: List installed packages
        run: pip list
      
      - name: Run tests with pytest markers
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Tests are marked with platform-specific markers:
          # - @pytest.mark.windows - Windows UI Automation tests
          # - @pytest.mark.macos - macOS AX/AppleScript tests
          # - @pytest.mark.linux - Linux-specific tests
          # - @pytest.mark.requires_ollama - needs Ollama server
          # - @pytest.mark.requires_gui - needs display/GUI
          # - @pytest.mark.integration - full integration tests
          
          if [ "$RUNNER_OS" == "Windows" ]; then
            # Run all tests except macOS/Linux-specific, GUI, Ollama, and integration
            # Skip problematic path tests with 8.3 short names
            pytest tests/ -v -m "not linux and not macos and not requires_gui and not requires_ollama and not integration" \
              -k "not test_infer_project_root_from_file and not test_resolve_screenshot_file_accepts_the_processed_name"
          else
            # Ubuntu: run all tests except Windows/macOS-specific, GUI, Ollama, and integration
            pytest tests/ -v -m "not windows and not macos and not requires_gui and not requires_ollama and not integration"
            xvfb-run -a pytest tests/test_linux_screenshot_capture.py -v -m "linux" \
              -k "xvfb"
          fi
        shell: bash
      
      - name: Test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- **OS**: ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Python**: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Markers" >> $GITHUB_STEP_SUMMARY
          echo "Tests are skipped based on pytest markers:" >> $GITHUB_STEP_SUMMARY
          echo "- \`@pytest.mark.windows\` - Windows UI Automation tests (skipped on Ubuntu)" >> $GITHUB_STEP_SUMMARY
          echo "- \`@pytest.mark.macos\` - macOS AX/AppleScript tests (skipped on both)" >> $GITHUB_STEP_SUMMARY
          echo "- \`@pytest.mark.linux\` - Linux-specific tests (run on Ubuntu)" >> $GITHUB_STEP_SUMMARY
          echo "- \`@pytest.mark.requires_ollama\` - needs Ollama server (skipped)" >> $GITHUB_STEP_SUMMARY
          echo "- \`@pytest.mark.requires_gui\` - needs display/GUI (skipped)" >> $GITHUB_STEP_SUMMARY
          echo "- \`@pytest.mark.integration\` - full integration tests (skipped)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All non-skipped tests must pass for CI to succeed." >> $GITHUB_STEP_SUMMARY
        shell: bash
